<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>HOSTING PANEL LOGIN</title>

<style>

*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent; /* ক্লিকে নীল আলো বন্ধ করবে */
}

html, body {
    width: 100%;
    height: 100%;
    height: 100dvh; /* মোবাইলের জন্য নিখুঁত হাইট */
    overflow: hidden; /* স্ক্রিন উপরে-নিচে মুভ হওয়া বন্ধ করবে */
}

body{
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #132a4e 0%, #0b1f3a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
    padding: 20px;
}

.login-card{
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
    background: rgba(18, 26, 43, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

.logo{
    text-align: center;
    font-size: 36px;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
}

h2{
    text-align: center;
    margin-bottom: 4px;
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
}

.subtitle{
    text-align: center;
    color: #8fa3bf;
    font-size: 13px;
    margin-bottom: 24px;
}

.input-group {
    margin-bottom: 14px;
}

input{
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #263a5c;
    border-radius: 8px;
    outline: none;
    background: #0b1424;
    color: #ffffff;
    font-size: 14px;
    transition: all 0.25s ease;
}

input::placeholder{
    color: #5d718d;
}

input:focus{
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    background: #0f1b2e;
}

button{
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    outline: none;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
}

button:hover{
    background: linear-gradient(135deg, #4f8cff 0%, #1d4ed8 100%);
    box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
}

button:active {
    transform: scale(0.98);
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
}

.error{
    padding: 10px;
    margin-bottom: 16px;
    border-radius: 8px;
    background: rgba(74, 32, 37, 0.8);
    border: 1px solid #71333a;
    color: #ff9da6;
    text-align: center;
    font-size: 13px;
}

</style>

</head>

<body>

<form class="login-card" method="POST">

    <div class="logo">🚀</div>

    <h2>HOSTING PANEL</h2>

    <div class="subtitle">
        Administrator Login
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <div class="input-group">
        <input
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
        >
    </div>

    <div class="input-group">
        <input
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >
    </div>

    <button type="submit">
        🔑 LOGIN PANEL
    </button>

</form>

</body>
</html>
